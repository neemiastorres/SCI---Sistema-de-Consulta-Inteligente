<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel | Consulta Inteligente</title>
  <meta name="theme-color" content="#0B1F3A">

  <!-- Força a invalidação de cache no navegador -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Bibliotecas de relatórios em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #1e293b;
    }

    .card{
      background: #ffffff;
      width: 100%;
      max-width: 920px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    /* Container e Ajuste da Logo */
    .logo-container{
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .logo-partido{
      max-width: 160px;
      max-height: 85px;
      height: auto;
      object-fit: contain;
    }

    h1{ 
      color: #0f172a; 
      font-size: 26px; 
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px; 
    }

    .subtitle{ 
      color: #64748b; 
      font-size: 14px; 
      font-weight: 500;
      margin-bottom: 24px; 
    }
    
    /* Grid de Indicadores */
    .stats-grid{ 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 16px; 
      margin-bottom: 24px; 
    }

    .stat-box{ 
      background: #f8fafc; 
      border-radius: 16px; 
      padding: 18px; 
      border: 1px solid #e2e8f0;
    }

    .stat-val{ 
      font-size: 28px; 
      font-weight: 800; 
      color: #0284c7; 
    }

    .stat-lbl{ 
      font-size: 12px; 
      color: #64748b; 
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px; 
    }
    
    /* Header do Painel de Filtros com Botão Limpar */
    .filters-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .filters-title{
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-limpar{
      background: none;
      border: none;
      color: #0284c7;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background .2s;
    }

    .btn-limpar:hover{
      background: #e0f2fe;
    }

    /* Painel de Filtros Avançados */
    .filters-grid{
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      text-align: left;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    @media (max-width: 768px){
      .filters-grid{ grid-template-columns: 1fr; }
    }

    .filter-group label{
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .filter-group input, .filter-group select{
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: all .2s ease;
    }

    .filter-group input:focus, .filter-group select:focus{ 
      border-color: #0284c7; 
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* Tabela de Resultados */
    .table-container{ 
      overflow-x: auto; 
      margin-bottom: 18px; 
      border-radius: 12px; 
      border: 1px solid #e2e8f0; 
      min-height: 220px;
      position: relative;
    }

    table{ 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: left; 
    }

    th{ 
      background: #0f172a; 
      color: #f8fafc; 
      padding: 14px 12px; 
      font-weight: 600;
      white-space: nowrap; 
    }

    td{ 
      padding: 12px; 
      border-bottom: 1px solid #f1f5f9; 
      white-space: nowrap; 
      color: #334155;
    }

    tr:nth-child(even){ background: #f8fafc; }
    
    .status-badge{
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
    }

    /* Animação do Spinner de Carregamento */
    .loading-box{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      gap: 12px;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
    }

    .spinner{
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin{
      to { transform: rotate(360deg); }
    }

    /* Controles de Paginação */
    .pagination-container{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pagination-info{ 
      font-size: 13px; 
      color: #64748b; 
      font-weight: 500; 
    }

    .pagination-buttons{ 
      display: flex; 
      gap: 8px; 
      align-items: center; 
    }

    .btn-page{
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all .2s;
    }

    .btn-page:hover:not(:disabled){ 
      background: #0f172a; 
      color: #ffffff; 
      border-color: #0f172a;
    }

    .btn-page:disabled{ 
      opacity: 0.4; 
      cursor: not-allowed; 
      border-color: #e2e8f0; 
    }

    /* Botões Principais */
    .btn{
      display: block; 
      width: 100%; 
      border: none; 
      border-radius: 12px; 
      padding: 15px;
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      text-decoration: none;
      margin-top: 12px; 
      text-align: center;
      transition: all .2s ease;
    }

    .btn-pdf{ 
      background: #10b981; 
      color: #ffffff; 
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-pdf:hover{ 
      background: #059669; 
      transform: translateY(-1px);
    }

    .btn-voltar{ 
      background: #0f172a; 
      color: #ffffff; 
    }

    .btn-voltar:hover{ 
      background: #1e293b; 
    }

    .btn-sair{ 
      background: #ef4444; 
      color: #ffffff; 
    }

    .btn-sair:hover{ 
      background: #dc2626; 
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo do Partido -->
  <div class="logo-container">
    <img src="logoapp.png" alt="Logo" class="logo-partido" onerror="this.style.display='none'">
  </div>

  <h1>Consulta Inteligente</h1>
  <div class="subtitle" id="infoUsuario">Carregando dados...</div>

  <!-- Indicadores -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val" id="totalCadastros">--</div>
      <div class="stat-lbl">Registros Encontrados</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="ultimoCadastro">--</div>
      <div class="stat-lbl">Última Atualização</div>
    </div>
  </div>

  <!-- Header dos Filtros com Botão de Limpar -->
  <div class="filters-header">
    <span class="filters-title">Filtros de Pesquisa</span>
    <button type="button" class="btn-limpar" onclick="limparFiltros()">↺ Limpar Filtros</button>
  </div>

  <!-- Filtros -->
  <div class="filters-grid">
    <div class="filter-group">
      <label for="buscaNome">Buscar por Nome / Celular</label>
      <input type="text" id="buscaNome" placeholder="Digite o nome..." oninput="aplicarFiltros()">
    </div>
    <div class="filter-group">
      <label for="filtroEstado">Estado (UF)</label>
      <select id="filtroEstado" onchange="aoMudarEstado()">
        <option value="">Todos os Estados</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filtroCidade">Cidade</label>
      <select id="filtroCidade" onchange="aplicarFiltros()">
        <option value="">Todas as Cidades</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filtroStatus">Status 2</label>
      <select id="filtroStatus" onchange="aplicarFiltros()">
        <option value="">Todos os Status</option>
      </select>
    </div>
  </div>

  <!-- Tabela de Resultados -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Celular</th>
          <th>Cidade</th>
          <th>Estado</th>
          <th>Status 2</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <tr>
          <td colspan="5">
            <div class="loading-box">
              <div class="spinner"></div>
              <span>Carregando registros da planilha...</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <div class="pagination-container">
    <div class="pagination-info">
      Exibir 
      <select id="itensPorPagina" onchange="mudarItensPorPagina()" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1;">
        <option value="10" selected>10 por página</option>
        <option value="25">25 por página</option>
      </select>
      | Exibindo <span id="lblInicio">0</span>-<span id="lblFim">0</span> de <span id="lblTotalFiltro">0</span>
    </div>
    <div class="pagination-buttons">
      <button class="btn-page" id="btnAnt" onclick="paginaAnterior()">◄ Anterior</button>
      <span id="lblPaginaAtual" style="font-size:13px; font-weight:bold; color:#0f172a;">Pág. 1 de 1</span>
      <button class="btn-page" id="btnProx" onclick="proximaPagina()">Próximo ►</button>
    </div>
  </div>

  <!-- Ações -->
  <button type="button" class="btn btn-pdf" onclick="gerarPDF()">📄 Baixar e Imprimir Relatório em PDF</button>
  <a class="btn btn-voltar" href="index.html">Voltar à Capa</a>
  <button type="button" class="btn btn-sair" onclick="sair()">Sair do Sistema</button>
</div>

<script>
const VERSAO_APP = "1.0.6";
const API_URL = "https://script.google.com/macros/s/AKfycbwlvHJZn1audQQ1K-trijBmOeeszv7_akRGbqtrx86RR6dyEWGkroF9T1vH3t-RVi9E-g/exec";

// Autenticação prévia local
const usuario = JSON.parse(localStorage.getItem("usuarioConsulta") || "null");

if(!usuario || !usuario.email){
  localStorage.removeItem("usuarioConsulta");
  window.location.href = "login.html";
} else {
  document.getElementById("infoUsuario").innerText = `Usuário: ${usuario.email} | Permissão: ${usuario.estados || "Geral"}`;
}

let dadosGerais = [];
let dadosFiltrados = [];

let paginaAtual = 1;
let itensPorPagina = 10;

async function carregarDados(){
  exibirSpinner();
  try {
    const tokenSeguro = encodeURIComponent(usuario ? usuario.token || "" : "");
    const res = await fetch(`${API_URL}?token=${tokenSeguro}&_v=${VERSAO_APP}`, { cache: "no-store" });
    const data = await res.json();

    if(data.status === "ok"){
      dadosGerais = data.resultados || [];
      dadosFiltrados = dadosGerais;
      
      document.getElementById("ultimoCadastro").innerText = new Date().toLocaleDateString("pt-BR");
      
      populaOpcoesFiltros();
      aplicarFiltros();
    } else {
      if(data.mensagem && (data.mensagem.includes("sessão") || data.mensagem.includes("token"))){
        sair();
        return;
      }
      document.getElementById("tabelaCorpo").innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">${data.mensagem || "Erro ao carregar dados."}</td></tr>`;
    }
  } catch(e) {
    document.getElementById("tabelaCorpo").innerHTML = `<tr><td colspan="5" style="text-align:center; color:red; padding:20px;">Erro de conexão com a planilha. Faça login novamente.</td></tr>`;
  }
}

function exibirSpinner(){
  document.getElementById("tabelaCorpo").innerHTML = `
    <tr>
      <td colspan="5">
        <div class="loading-box">
          <div class="spinner"></div>
          <span>Carregando registros da planilha...</span>
        </div>
      </td>
    </tr>
  `;
}

function populaOpcoesFiltros(){
  const selectUF = document.getElementById("filtroEstado");
  const selectStatus = document.getElementById("filtroStatus");

  const estadosUnicos = [...new Set(dadosGerais.map(i => (i.estado || "").trim().toUpperCase()))].filter(e => e && e !== "-").sort();
  const statusUnicos = [...new Set(dadosGerais.map(i => (i.status2 || "").trim()))].filter(s => s && s !== "-").sort();

  selectUF.innerHTML = '<option value="">Todos os Estados</option>';
  estadosUnicos.forEach(uf => {
    selectUF.innerHTML += `<option value="${uf}">${uf}</option>`;
  });

  selectStatus.innerHTML = '<option value="">Todos os Status</option>';
  statusUnicos.forEach(st => {
    selectStatus.innerHTML += `<option value="${st}">${st}</option>`;
  });

  populaCidades();
}

function populaCidades(){
  const selectUF = document.getElementById("filtroEstado").value;
  const selectCidade = document.getElementById("filtroCidade");

  let dadosParaCidades = dadosGerais;
  if(selectUF){
    dadosParaCidades = dadosGerais.filter(i => (i.estado || "").trim().toUpperCase() === selectUF);
  }

  const cidadesUnicas = [...new Set(dadosParaCidades.map(i => (i.cidade || "").trim()))].filter(c => c && c !== "-").sort();

  selectCidade.innerHTML = '<option value="">Todas as Cidades</option>';
  cidadesUnicas.forEach(c => {
    selectCidade.innerHTML += `<option value="${c}">${c}</option>`;
  });
}

function aoMudarEstado(){
  populaCidades();
  aplicarFiltros();
}

function aplicarFiltros(){
  const termoNome = document.getElementById("buscaNome").value.trim().toLowerCase();
  const ufSel = document.getElementById("filtroEstado").value;
  const cidadeSel = document.getElementById("filtroCidade").value.toLowerCase();
  const statusSel = document.getElementById("filtroStatus").value.toLowerCase();

  dadosFiltrados = dadosGerais.filter(i => {
    const nome = (i.nome || "").toLowerCase();
    const celular = (i.whatsapp || i.celular || "").toLowerCase();
    const estado = (i.estado || "").toUpperCase().trim();
    const cidade = (i.cidade || "").toLowerCase().trim();
    const status = (i.status2 || "").toLowerCase().trim();

    const bateNome = !termoNome || nome.includes(termoNome) || celular.includes(termoNome);
    const bateUF = !ufSel || estado === ufSel;
    const bateCidade = !cidadeSel || cidade === cidadeSel;
    const bateStatus = !statusSel || status === statusSel;

    return bateNome && bateUF && bateCidade && bateStatus;
  });

  paginaAtual = 1;
  renderizarPagina();
}

// Reseta todos os filtros para o estado inicial
function limparFiltros(){
  document.getElementById("buscaNome").value = "";
  document.getElementById("filtroEstado").value = "";
  document.getElementById("filtroStatus").value = "";
  populaCidades();
  aplicarFiltros();
}

function renderizarPagina(){
  const total = dadosFiltrados.length;
  document.getElementById("totalCadastros").innerText = total;
  document.getElementById("lblTotalFiltro").innerText = total;

  const totalPaginas = Math.ceil(total / itensPorPagina) || 1;
  if(paginaAtual > totalPaginas) paginaAtual = totalPaginas;

  const inicio = (paginaAtual - 1) * itensPorPagina;
  const fim = Math.min(inicio + itensPorPagina, total);

  document.getElementById("lblInicio").innerText = total === 0 ? 0 : inicio + 1;
  document.getElementById("lblFim").innerText = fim;
  document.getElementById("lblPaginaAtual").innerText = `Pág. ${paginaAtual} de ${totalPaginas}`;

  document.getElementById("btnAnt").disabled = (paginaAtual === 1);
  document.getElementById("btnProx").disabled = (paginaAtual >= totalPaginas || total === 0);

  const listaPagina = dadosFiltrados.slice(inicio, fim);
  renderTabela(listaPagina);
}

function renderTabela(lista){
  const tbody = document.getElementById("tabelaCorpo");
  if(lista.length === 0){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">Nenhum registro localizado com estes filtros.</td></tr>`;
    return;
  }
  tbody.innerHTML = "";
  lista.forEach(i => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><strong>${i.nome || "-"}</strong></td>
      <td>${i.whatsapp || i.celular || "-"}</td>
      <td>${i.cidade || "-"}</td>
      <td>${i.estado || "-"}</td>
      <td><span class="status-badge">${i.status2 || "Pendente"}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function paginaAnterior(){
  if(paginaAtual > 1){
    paginaAtual--;
    renderizarPagina();
  }
}

function proximaPagina(){
  const totalPaginas = Math.ceil(dadosFiltrados.length / itensPorPagina);
  if(paginaAtual < totalPaginas){
    paginaAtual++;
    renderizarPagina();
  }
}

function mudarItensPorPagina(){
  itensPorPagina = parseInt(document.getElementById("itensPorPagina").value);
  paginaAtual = 1;
  renderizarPagina();
}

function gerarPDF(){
  if(dadosFiltrados.length === 0){
    alert("Não existem registros selecionados para gerar o relatório.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p", "mm", "a4");

  doc.setFillColor(15, 23, 42);
  doc.rect(0, 0, 210, 28, "F");
  
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(15);
  doc.text("RELATÓRIO DE CONSULTA E STATUS", 14, 16);
  
  doc.setFontSize(9);
  doc.text(`Emissão: ${new Date().toLocaleDateString("pt-BR")} | Total de Registros Filtrados: ${dadosFiltrados.length}`, 14, 23);

  const colunas = ["Nome Completo", "Celular", "Cidade", "Estado", "Status 2"];
  const linhas = dadosFiltrados.map(r => [
    r.nome || "-",
    r.whatsapp || r.celular || "-",
    r.cidade || "-",
    r.estado || "-",
    r.status2 || "Pendente"
  ]);

  doc.autoTable({
    startY: 32,
    head: [colunas],
    body: linhas,
    theme: "striped",
    headStyles: { 
      fillColor: [15, 23, 42], 
      textColor: [255, 255, 255], 
      fontStyle: "bold",
      fontSize: 9 
    },
    styles: { 
      fontSize: 8, 
      cellPadding: 3, 
      valign: "middle" 
    },
    columnStyles: {
      0: { cellWidth: 55 },
      1: { cellWidth: 35 },
      2: { cellWidth: 40 },
      3: { cellWidth: 20 },
      4: { cellWidth: 35 }
    }
  });

  doc.save(`Relatorio_Consulta_${new Date().toISOString().split("T")[0]}.pdf`);
}

function sair(){
  localStorage.removeItem("usuarioConsulta");
  window.location.href = "login.html";
}

carregarDados();
</script>

</body>
</html>
