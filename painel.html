<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Artigo Um</title>
  <meta name="theme-color" content="#0B1F3A">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #1e293b;
    }

    .card{
      background: #ffffff;
      width: 100%;
      max-width: 1080px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .logo-container{
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }

    .logo-partido{
      max-width: 160px;
      max-height: 85px;
      height: auto;
      object-fit: contain;
    }

    h1{ color: #0f172a; font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .subtitle{ color: #64748b; font-size: 14px; font-weight: 500; margin-bottom: 24px; }
    
    .stats-grid{ 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 16px; 
      margin-bottom: 24px; 
    }

    .stat-box{ 
      background: #f8fafc; 
      border-radius: 16px; 
      padding: 18px; 
      border: 1px solid #e2e8f0;
    }

    .stat-val{ font-size: 28px; font-weight: 800; color: #0284c7; }
    .stat-lbl{ font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-top: 4px; }

    .filters-header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .filters-title{ font-size: 13px; font-weight: 700; color: #0f172a; text-transform: uppercase; }

    .btn-limpar{
      background: none; border: none; color: #0284c7; font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }
    .btn-limpar:hover{ background: #e0f2fe; }

    .filters-grid{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: left;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    @media (max-width: 820px){
      .filters-grid{ grid-template-columns: 1fr; }
    }

    .filter-group label{
      display: block; font-weight: 600; color: #334155; margin-bottom: 6px; font-size: 12px;
    }

    .filter-group input, .filter-group select{
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; outline: none; background: #ffffff; color: #0f172a;
    }

    .filter-group input:focus, .filter-group select:focus{ border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

    .table-container{ 
      overflow-x: auto; margin-bottom: 18px; border-radius: 12px; border: 1px solid #e2e8f0; min-height: 220px;
    }

    table{ width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th{ background: #0f172a; color: #f8fafc; padding: 14px 12px; font-weight: 600; white-space: nowrap; }
    td{ padding: 12px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; color: #334155; }
    tr:nth-child(even){ background: #f8fafc; }

    .loading-box{
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 12px; color: #64748b; font-size: 13px;
    }

    .spinner{
      width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #0284c7; border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    @keyframes spin{ to { transform: rotate(360deg); } }

    .pagination-container{
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }

    .pagination-info{ font-size: 13px; color: #64748b; }
    .pagination-buttons{ display: flex; gap: 8px; align-items: center; }

    .btn-page{
      padding: 8px 16px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    .btn-page:disabled{ opacity: 0.4; cursor: not-allowed; }

    .btn{
      display: block; width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; margin-top: 12px; text-align: center;
    }

    .btn-pdf{ background: #10b981; color: #ffffff; }
    .btn-pdf:hover{ background: #059669; }
    .btn-voltar{ background: #0f172a; color: #ffffff; }
    .btn-sair{ background: #ef4444; color: #ffffff; }
  </style>
</head>
<body>

<div class="card">

  <div class="logo-container">
    <img src="logo-a1.png" alt="Logo" class="logo-partido" onerror="this.src='logoapp.png'">
  </div>

  <h1>Consulta do Administrador</h1>
  <div class="subtitle" id="infoUsuario">Carregando dados...</div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val" id="totalCadastros">--</div>
      <div class="stat-lbl">Registros Encontrados</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="ultimoCadastro">--</div>
      <div class="stat-lbl">Última Atualização</div>
    </div>
  </div>

  <div class="filters-header">
    <span class="filters-title">Pesquisa Separada por Campo</span>
    <button type="button" class="btn-limpar" onclick="limparFiltros()">↺ Limpar Filtros</button>
  </div>

  <div class="filters-grid">
    <div class="filter-group">
      <label for="buscaNome">Nome Completo</label>
      <input type="text" id="buscaNome" placeholder="Digite o nome..." oninput="aplicarFiltros()">
    </div>
    <div class="filter-group">
      <label for="buscaCelular">Celular / WhatsApp</label>
      <input type="text" id="buscaCelular" placeholder="Digite o telefone..." oninput="aplicarFiltros()">
    </div>
    <div class="filter-group">
      <label for="filtroEstado">Estado (UF)</label>
      <select id="filtroEstado" onchange="aoMudarEstado()">
        <option value="">Todos os Estados</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filtroCidade">Cidade</label>
      <select id="filtroCidade" onchange="aplicarFiltros()">
        <option value="">Todas as Cidades</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="buscaBairro">Bairro</label>
      <input type="text" id="buscaBairro" placeholder="Digite o bairro..." oninput="aplicarFiltros()">
    </div>
    <div class="filter-group">
      <label for="buscaCoordenador">Coordenador / Líder</label>
      <input type="text" id="buscaCoordenador" placeholder="Digite o coordenador..." oninput="aplicarFiltros()">
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Nome</th>
          <th>Celular / Whats</th>
          <th>Cidade</th>
          <th>Bairro</th>
          <th>UF</th>
          <th>Coordenador</th>
          <th>E-mail</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <tr>
          <td colspan="8">
            <div class="loading-box">
              <div class="spinner"></div>
              <span>Carregando cadastros...</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-container">
    <div class="pagination-info">
      Exibir 
      <select id="itensPorPagina" onchange="mudarItensPorPagina()" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1;">
        <option value="10" selected>10 por página</option>
        <option value="25">25 por página</option>
        <option value="50">50 por página</option>
      </select>
      | Exibindo <span id="lblInicio">0</span>-<span id="lblFim">0</span> de <span id="lblTotalFiltro">0</span>
    </div>
    <div class="pagination-buttons">
      <button class="btn-page" id="btnAnt" onclick="paginaAnterior()">◄ Anterior</button>
      <span id="lblPaginaAtual" style="font-size:13px; font-weight:bold; color:#0f172a;">Pág. 1 de 1</span>
      <button class="btn-page" id="btnProx" onclick="proximaPagina()">Próximo ►</button>
    </div>
  </div>

  <button type="button" class="btn btn-pdf" onclick="gerarPDF()">📄 Imprimir / Salvar Relatório em PDF</button>
  <a class="btn btn-voltar" href="index.html">Voltar à Capa</a>
  <button type="button" class="btn btn-sair" onclick="sair()">Sair do Sistema</button>
</div>

<script>
const VERSAO_APP = "1.2.0";
const API_URL = "https://script.google.com/macros/s/AKfycbxcFcKBO39I7UibZoFiPz3a1TZIpXtN5kGK0XnFJu-P-yfMhpCcGCMZIE2LmGtnD-qFqw/exec";

// Autenticação oficial do Cadastro Geral
const usuario = JSON.parse(localStorage.getItem("usuarioLogado") || "null");

if(!usuario || !usuario.token){
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
} else {
  document.getElementById("infoUsuario").innerText = `Usuário: ${usuario.email} | Permissão: ${usuario.estados || "Geral"}`;
}

let dadosGerais = [];
let dadosFiltrados = [];

let paginaAtual = 1;
let itensPorPagina = 10;

async function carregarDados(){
  exibirSpinner();
  try {
    const tokenSeguro = encodeURIComponent(usuario ? usuario.token || "" : "");
    const res = await fetch(`${API_URL}?token=${tokenSeguro}&_v=${VERSAO_APP}`, { cache: "no-store" });
    const data = await res.json();

    if(data.status === "ok"){
      dadosGerais = data.resultados || [];
      dadosFiltrados = dadosGerais;
      
      document.getElementById("ultimoCadastro").innerText = data.ultimo ? new Date(data.ultimo).toLocaleDateString("pt-BR") : new Date().toLocaleDateString("pt-BR");
      
      populaOpcoesFiltros();
      aplicarFiltros();
    } else {
      if(data.mensagem && (data.mensagem.includes("sessão") || data.mensagem.includes("token") || data.mensagem.includes("autorizado"))){
        sair();
        return;
      }
      document.getElementById("tabelaCorpo").innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; padding:20px;">${data.mensagem || "Erro ao carregar dados."}</td></tr>`;
    }
  } catch(e) {
    document.getElementById("tabelaCorpo").innerHTML = `<tr><td colspan="8" style="text-align:center; color:red; padding:20px;">Erro de conexão com o servidor. Tente fazer login novamente.</td></tr>`;
  }
}

function exibirSpinner(){
  document.getElementById("tabelaCorpo").innerHTML = `
    <tr>
      <td colspan="8">
        <div class="loading-box">
          <div class="spinner"></div>
          <span>Carregando cadastros...</span>
        </div>
      </td>
    </tr>
  `;
}

function populaOpcoesFiltros(){
  const selectUF = document.getElementById("filtroEstado");
  const estadosUnicos = [...new Set(dadosGerais.map(i => (i.estado || "").trim().toUpperCase()))].filter(e => e && e !== "-").sort();

  selectUF.innerHTML = '<option value="">Todos os Estados</option>';
  estadosUnicos.forEach(uf => {
    selectUF.innerHTML += `<option value="${uf}">${uf}</option>`;
  });

  populaCidades();
}

function populaCidades(){
  const selectUF = document.getElementById("filtroEstado").value;
  const selectCidade = document.getElementById("filtroCidade");

  let dadosParaCidades = dadosGerais;
  if(selectUF){
    dadosParaCidades = dadosGerais.filter(i => (i.estado || "").trim().toUpperCase() === selectUF);
  }

  const cidadesUnicas = [...new Set(dadosParaCidades.map(i => (i.cidade || "").trim()))].filter(c => c && c !== "-").sort();

  selectCidade.innerHTML = '<option value="">Todas as Cidades</option>';
  cidadesUnicas.forEach(c => {
    selectCidade.innerHTML += `<option value="${c}">${c}</option>`;
  });
}

function aoMudarEstado(){
  populaCidades();
  aplicarFiltros();
}

function aplicarFiltros(){
  const nomeSel = document.getElementById("buscaNome").value.trim().toLowerCase();
  const celularSel = document.getElementById("buscaCelular").value.trim().toLowerCase();
  const ufSel = document.getElementById("filtroEstado").value;
  const cidadeSel = document.getElementById("filtroCidade").value.toLowerCase();
  const bairroSel = document.getElementById("buscaBairro").value.trim().toLowerCase();
  const coordSel = document.getElementById("buscaCoordenador").value.trim().toLowerCase();

  dadosFiltrados = dadosGerais.filter(i => {
    const nome = (i.nome || "").toLowerCase();
    const celular = (i.whatsapp || i.celular || "").toLowerCase();
    const estado = (i.estado || "").toUpperCase().trim();
    const cidade = (i.cidade || "").toLowerCase().trim();
    const bairro = (i.bairro || "").toLowerCase().trim();
    const coordenador = (i.coordenador || "").toLowerCase().trim();

    const bateNome = !nomeSel || nome.includes(nomeSel);
    const bateCelular = !celularSel || celular.includes(celularSel);
    const bateUF = !ufSel || estado === ufSel;
    const bateCidade = !cidadeSel || cidade === cidadeSel;
    const bateBairro = !bairroSel || bairro.includes(bairroSel);
    const bateCoord = !coordSel || coordenador.includes(coordSel);

    return bateNome && bateCelular && bateUF && bateCidade && bateBairro && bateCoord;
  });

  paginaAtual = 1;
  renderizarPagina();
}

function limparFiltros(){
  document.getElementById("buscaNome").value = "";
  document.getElementById("buscaCelular").value = "";
  document.getElementById("filtroEstado").value = "";
  document.getElementById("buscaBairro").value = "";
  document.getElementById("buscaCoordenador").value = "";
  populaCidades();
  aplicarFiltros();
}

function renderizarPagina(){
  const total = dadosFiltrados.length;
  document.getElementById("totalCadastros").innerText = total;
  document.getElementById("lblTotalFiltro").innerText = total;

  const totalPaginas = Math.ceil(total / itensPorPagina) || 1;
  if(paginaAtual > totalPaginas) paginaAtual = totalPaginas;

  const inicio = (paginaAtual - 1) * itensPorPagina;
  const fim = Math.min(inicio + itensPorPagina, total);

  document.getElementById("lblInicio").innerText = total === 0 ? 0 : inicio + 1;
  document.getElementById("lblFim").innerText = fim;
  document.getElementById("lblPaginaAtual").innerText = `Pág. ${paginaAtual} de ${totalPaginas}`;

  document.getElementById("btnAnt").disabled = (paginaAtual === 1);
  document.getElementById("btnProx").disabled = (paginaAtual >= totalPaginas || total === 0);

  const listaPagina = dadosFiltrados.slice(inicio, fim);
  renderTabela(listaPagina);
}

function renderTabela(lista){
  const tbody = document.getElementById("tabelaCorpo");
  if(lista.length === 0){
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#64748b; padding:20px;">Nenhum registro localizado com estes filtros.</td></tr>`;
    return;
  }
  tbody.innerHTML = "";
  lista.forEach(i => {
    const dataFmt = i.data ? new Date(i.data).toLocaleDateString("pt-BR") : "-";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${dataFmt}</td>
      <td><strong>${i.nome || "-"}</strong></td>
      <td>${i.whatsapp || i.celular || "-"}</td>
      <td>${i.cidade || "-"}</td>
      <td>${i.bairro || "-"}</td>
      <td>${i.estado || "-"}</td>
      <td>${i.coordenador || "-"}</td>
      <td>${i.email || "-"}</td>
    `;
    tbody.appendChild(tr);
  });
}

function paginaAnterior(){
  if(paginaAtual > 1){
    paginaAtual--;
    renderizarPagina();
  }
}

function proximaPagina(){
  const totalPaginas = Math.ceil(dadosFiltrados.length / itensPorPagina);
  if(paginaAtual < totalPaginas){
    paginaAtual++;
    renderizarPagina();
  }
}

function mudarItensPorPagina(){
  itensPorPagina = parseInt(document.getElementById("itensPorPagina").value);
  paginaAtual = 1;
  renderizarPagina();
}

function gerarPDF(){
  if(dadosFiltrados.length === 0){
    alert("Não existem registros selecionados para gerar o relatório.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p", "mm", "a4");

  doc.setFillColor(15, 23, 42);
  doc.rect(0, 0, 210, 28, "F");
  
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(15);
  doc.text("RELATÓRIO DE CADASTROS - ARTIGO UM", 14, 16);
  
  doc.setFontSize(9);
  doc.text(`Emissão: ${new Date().toLocaleDateString("pt-BR")} | Registros Filtrados: ${dadosFiltrados.length}`, 14, 23);

  const colunas = ["Data", "Nome Completo", "Celular", "Cidade/UF", "Coordenador", "E-mail"];
  const linhas = dadosFiltrados.map(r => [
    r.data ? new Date(r.data).toLocaleDateString("pt-BR") : "-",
    r.nome || "-",
    r.whatsapp || r.celular || "-",
    (r.cidade || "-") + "/" + (r.estado || "-"),
    r.coordenador || "-",
    r.email || "-"
  ]);

  doc.autoTable({
    startY: 32,
    head: [colunas],
    body: linhas,
    theme: "striped",
    headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 8 },
    styles: { fontSize: 8, cellPadding: 3, valign: "middle" }
  });

  doc.save(`Relatorio_Cadastros_${new Date().toISOString().split("T")[0]}.pdf`);
}

function sair(){
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
}

carregarDados();
</script>

</body>
</html>
