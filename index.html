<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta Inteligente | Artigo Um</title>
  <meta name="theme-color" content="#0B1F3A">
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:Arial, sans-serif;
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }
    .card{
      background:#fff;
      width:100%;
      max-width:420px;
      border-radius:22px;
      box-shadow:0 12px 30px rgba(0,0,0,.12);
      padding:36px 26px;
      text-align:center;
    }
    .logo{ width:90px; height:auto; margin-bottom:16px; }
    h1{ color:#0B1F3A; font-size:26px; margin-bottom:10px; }
    p{ color:#555; font-size:15px; line-height:1.5; margin-bottom:24px; }
    .btn{
      display:block;
      width:100%;
      padding:15px;
      border-radius:12px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      font-size:16px;
      background:#0B1F3A;
      transition:background .2s;
    }
    .btn:hover{ background:#13305c; }
  </style>
</head>
<body>

<div class="card">
  <img src="logo-a1.png" alt="Logo" class="logo" onerror="this.style.display='none'">
  <h1>Consulta Inteligente</h1>
  <p>
    Plataforma de acesso rápido para consulta de cadastros,
    pesquisa em tempo real e geração de relatórios oficiais por Estado.
  </p>
  <a class="btn" href="login.html">Acessar Sistema</a>
</div>

</body>
</html>
