<!DOCTYPE html>
<html lang="pt-BR">
<head>

      margin:0;
    }
    .card{
      background:#fff;
      width:100%;
      max-width:420px;

      box-shadow:0 10px 25px rgba(0,0,0,.12);

    }

      margin-bottom:10px;
    }
    p{
      color:#555;
      line-height:1.6;
    }
    .btn{
      display:block;
      width:100%;
      padding:14px;
      margin-top:16px;
      border-radius:10px;

      color:white;
      font-weight:bold;
      background:#0B1F3A;
    }
  </style>
</head>
<body>

<div class="card">

  <h1>Consulta Inteligente</h1>

  <p>
    Aplicativo conectado diretamente à planilha oficial para consulta de contatos,

</html>
